<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arrow, learning mock</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: #f6f5f2; color: #1c1c1e;
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; text-align: center; }
  h1 { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: #6d685f; font-size: 13.5px; margin: 0 0 14px; }
  .phone {
    width: 350px; height: 660px; margin: 0 auto; background: #101216;
    border-radius: 34px; border: 3px solid #2a2d33; padding: 18px 14px 14px;
    text-align: left; color: #e8ebee; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .screen.on { display: flex; }
  .appname { font-size: 12.5px; color: #7d8590; margin-bottom: 6px; }
  .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .up { color: #4ade80; } .down { color: #ef5350; }
  .muted { color: #7d8590; font-size: 13px; }
  .card { background: #191c22; border-radius: 12px; padding: 11px 12px; margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .sp { flex: 1; }
  .pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; background: #232730; }
  .notif {
    background: #232a36; border-left: 3px solid #4ade80; border-radius: 10px;
    padding: 9px 11px; margin-top: 10px; font-size: 13.5px;
    animation: slidein .5s ease;
  }
  @keyframes slidein { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .abtn {
    font: inherit; font-size: 14px; font-weight: 700; border: none; border-radius: 999px;
    padding: 9px 0; width: 100%; cursor: default; margin-top: 8px;
    background: #4ade80; color: #0c130e;
  }
  .abtn.ghost { background: #232730; color: #e8ebee; }
  svg.spark { display: block; width: 100%; height: 90px; }
  .pie { display: block; margin: 6px auto; }
  .legend { font-size: 12.5px; color: #aab2bc; }
  .legend b { color: #e8ebee; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 6px; }
  .days { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .day { width: 16px; height: 16px; border-radius: 4px; background: #232730; }
  .day.g { background: #295c3d; } .day.r { background: #5c2929; }
  .bullet { background: #191c22; border-radius: 10px; padding: 8px 11px; margin-top: 7px; font-size: 13px; }
  .bar { height: 14px; border-radius: 7px; background: #232730; position: relative; margin: 8px 0 2px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: #4ade80; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #e8b44c; border-radius: 2px; }
  .caption {
    margin: 14px auto 10px; max-width: 350px; background: #fff; border: 1px solid #e4e1da;
    border-radius: 12px; padding: 10px 14px; font-size: 14px; text-align: left;
  }
  .caption b { display: block; font-size: 12.5px; color: #b57a00; font-weight: 700; margin-bottom: 1px; }
  .nav { display: flex; gap: 10px; justify-content: center; align-items: center; }
  .nav button {
    font: inherit; font-size: 14.5px; padding: 8px 20px; border-radius: 10px;
    border: 1.5px solid #cfcabf; background: #fff; cursor: pointer;
  }
  .nav button.primary { background: #1c1c1e; color: #fff; border-color: #1c1c1e; font-weight: 700; }
  .dots { color: #b5b0a6; font-size: 13px; min-width: 52px; }
  .goalchip { background: #2a2417; color: #e8b44c; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Arrow</h1>
  <p class="sub">What each part of the game does. Tap through.</p>

  <div class="phone" id="phone"></div>

  <div class="caption" id="caption"><b></b><span></span></div>
  <div class="nav">
    <button id="back">Back</button>
    <span class="dots" id="dots"></span>
    <button id="next" class="primary">Next</button>
  </div>
</div>

<script>
(function () {
  function pie(slices) {
    var total = slices.reduce(function (a, s) { return a + s.v; }, 0);
    var a0 = -Math.PI / 2, out = "";
    slices.forEach(function (s) {
      var a1 = a0 + (s.v / total) * Math.PI * 2;
      var x0 = 60 + 52 * Math.cos(a0), y0 = 60 + 52 * Math.sin(a0);
      var x1 = 60 + 52 * Math.cos(a1), y1 = 60 + 52 * Math.sin(a1);
      var big = a1 - a0 > Math.PI ? 1 : 0;
      out += '<path d="M60 60 L' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
        ' A52 52 0 ' + big + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + s.c + '"/>';
      a0 = a1;
    });
    return '<svg class="pie" width="120" height="120" viewBox="0 0 120 120">' + out + "</svg>";
  }
  function spark(points, color) {
    var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
    var span = max - min || 1;
    var pts = points.map(function (p, i) {
      return (i / (points.length - 1) * 316 + 2).toFixed(1) + "," +
        (84 - (p - min) / span * 78).toFixed(1);
    });
    return '<svg class="spark" viewBox="0 0 320 90"><polyline points="' + pts.join(" ") +
      '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/></svg>';
  }
  var C = { gme: "#ef5350", aapl: "#8f9aa8", f: "#5b8ed6", cash: "#4ade80", voo: "#a78bda", amc: "#e8b44c" };

  var messyPie = pie([
    { v: 5700, c: C.gme }, { v: 1980, c: C.aapl }, { v: 1100, c: C.f }, { v: 1120, c: C.cash },
  ]);
  var evenPie = pie([
    { v: 1830, c: C.gme }, { v: 2760, c: C.aapl }, { v: 1100, c: C.f }, { v: 2540, c: C.voo }, { v: 1400, c: C.cash },
  ]);

  var steps = [
    {
      goal: "Start of a level",
      note: "You get a client's portfolio and a money goal with a deadline. This level: turn Dev's $9,900 into $12,000 by June 2022.",
      app: '<div class="appname">Arrow · Pro Trader</div>' +
        '<div class="big">Client 1: Dev</div>' +
        '<div class="muted">Bought the GameStop squeeze. His account is yours to run now.</div>' +
        '<div class="card"><div class="row"><span>Balance</span><span class="sp"></span><b>$9,900</b></div>' +
        '<div class="row muted"><span>January 2021</span></div></div>' +
        '<div class="card"><div class="row"><span>Target</span><span class="sp"></span><b>$12,000</b></div>' +
        '<div class="row muted"><span>Tuition due June 2022</span></div></div>' +
        '<div class="goalchip">Hit the target and keep the client.</div>' +
        '<button class="abtn">Open his portfolio</button>',
    },
    {
      goal: "The portfolio screen",
      note: "The main chart is the whole portfolio's value. The pie shows what he owns. Right now 58 percent is in one stock.",
      app: '<div class="appname">Dev\'s portfolio</div>' +
        '<div class="big">$9,900</div><div class="muted up">+$34 today · Market open</div>' +
        spark([9840, 9862, 9851, 9878, 9912, 9900], "#4ade80") +
        messyPie +
        '<div class="legend"><span class="dot" style="background:#ef5350"></span><b>GameStop</b> 30 sh, $5,700 (58%)<br>' +
        '<span class="dot" style="background:#8f9aa8"></span><b>Apple</b> 15 sh, $1,980<br>' +
        '<span class="dot" style="background:#5b8ed6"></span><b>Ford</b> 100 sh, $1,100<br>' +
        '<span class="dot" style="background:#4ade80"></span><b>Cash</b> $1,120</div>',
    },
    {
      goal: "During the market day",
      note: "The market is open and prices move live. A notification and the top movers list tempt you to trade. Here you buy $500 of AMC at its high of the day.",
      app: '<div class="appname">Markets · Tuesday</div>' +
        '<div class="big">$9,940</div><div class="muted up">+0.4% today</div>' +
        spark([9900, 9895, 9915, 9908, 9932, 9940], "#4ade80") +
        '<div class="notif"><b>AMC is up 32% today.</b><br><span class="muted">Top mover. Everyone is watching.</span></div>' +
        '<div class="card"><b>Top movers</b>' +
        '<div class="row"><span>AMC</span><span class="sp"></span><span class="up">+32%</span></div>' +
        '<div class="row"><span>BBBY</span><span class="sp"></span><span class="up">+11%</span></div>' +
        '<div class="row"><span>NVDA</span><span class="sp"></span><span class="up">+3%</span></div></div>' +
        '<div class="muted" style="margin-top:8px">You tap AMC. You buy $500 at $14.20, the day\'s top.</div>',
    },
    {
      goal: "Options",
      note: "After some trades the game offers options, shown the way Robinhood really shows them. You spend $180 on a call betting GameStop rises by Friday.",
      app: '<div class="appname">GameStop $190 · options · Friday</div>' +
        '<div class="notif"><b>Options unlocked for this account.</b></div>' +
        '<div class="card"><div class="row"><span>$200 call</span><span class="sp"></span><span>$4.10</span></div>' +
        '<div class="row muted"><span>Max profit <span class="up">Unlimited</span> · Max loss $410</span></div></div>' +
        '<div class="card"><div class="row"><span>$210 call</span><span class="sp"></span><span>$1.80</span></div>' +
        '<div class="row muted"><span>Max profit <span class="up">Unlimited</span> · Max loss $180</span></div></div>' +
        '<div class="card"><div class="row"><span>$220 call</span><span class="sp"></span><span>$0.90</span></div>' +
        '<div class="row muted"><span>Max profit <span class="up">Unlimited</span> · Max loss $90</span></div></div>' +
        '<div class="muted" style="margin-top:8px">You buy the $210 call for $180.</div>',
    },
    {
      goal: "The option loses",
      note: "The option loses value every day and expires worthless on Friday. The $180 is gone. The AMC buy is down $81 the same week.",
      app: '<div class="appname">Your option</div>' +
        '<div class="big down">$0</div><div class="muted">GameStop $210 call, expired</div>' +
        spark([180, 165, 95, 60, 40, 0], "#ef5350") +
        '<div class="card"><div class="row"><span>Tue</span><span class="sp"></span><span>$180</span></div>' +
        '<div class="row"><span>Wed</span><span class="sp"></span><span class="down">$95</span></div>' +
        '<div class="row"><span>Thu</span><span class="sp"></span><span class="down">$40</span></div>' +
        '<div class="row"><span>Fri, expiry</span><span class="sp"></span><span class="down">$0</span></div></div>' +
        '<div class="muted" style="margin-top:8px">AMC drifted back to $11.90. The chase is down $81.</div>',
    },
    {
      goal: "After the close",
      note: "Prices stop at 4:00. You calmly rebalance: sell most of the GameStop and spread the money out. The orders fill at the next open.",
      app: '<div class="appname">After hours · 4:02</div>' +
        '<div class="big">Rebalance for open</div>' +
        '<div class="card"><div class="row"><span class="down">Sell 20 GameStop</span><span class="sp"></span><span>$3,640</span></div>' +
        '<div class="row muted"><span>fills at Monday\'s open</span></div></div>' +
        '<div class="card"><div class="row"><span class="up">Buy Apple, an index fund, keep cash</span></div>' +
        '<div class="row muted"><span>spread across the account</span></div></div>' +
        evenPie +
        '<button class="abtn">Queue for open</button>',
    },
    {
      goal: "Time passes",
      note: "Days you do not trade go by in about a second each. The market falls 12 percent in 2022 and you hold through it.",
      app: '<div class="appname">Fast forward</div>' +
        '<div class="big">14 months pass</div>' +
        '<div class="days">' + new Array(60).fill(0).map(function (_, i) {
          var cls = i < 34 ? (i % 5 === 3 ? "r" : "g") : (i % 3 === 0 ? "g" : "r");
          return '<span class="day ' + cls + '"></span>';
        }).join("") + "</div>" +
        spark([9900, 10800, 12100, 13400, 13800, 12600, 11400, 11200, 11900, 12410], "#4ade80") +
        '<div class="notif"><b>Markets tumble.</b><br><span class="muted">Dev\'s account is down 12% this month.</span></div>' +
        '<div class="muted" style="margin-top:6px">You hold. Each quiet day takes one second.</div>',
    },
    {
      goal: "End of the level",
      note: "You hit the goal. The card compares you to not trading at all: rebalancing once and holding would have made $761 more. That $761 is what your trades cost.",
      app: '<div class="appname">June 2022, deadline</div>' +
        '<div class="big up">$12,410</div><div class="muted">Tuition covered. Client kept.</div>' +
        '<div class="card"><div class="row"><span>You</span><span class="sp"></span><b>$12,410</b></div>' +
        '<div class="row"><span>Rebalanced once, then held</span><span class="sp"></span><b class="up">$13,171</b></div>' +
        '<div class="row"><span>Never touched</span><span class="sp"></span><b class="down">$8,590</b></div></div>' +
        '<div class="bar"><div class="fill" style="width:61%"></div><div class="mark" style="left:84%"></div></div>' +
        '<div class="muted">You beat 61 of 100 traders. Rebalancing once and holding beat 84.</div>' +
        '<div class="bullet">The AMC chase bought the day\'s top: $81 gone.</div>' +
        '<div class="bullet">The call decayed to zero in four days: $180 gone.</div>' +
        '<div class="bullet">The one rebalance at the close made the goal: $3,820 of it.</div>',
    },
    {
      goal: "Next level",
      note: "No lesson text. You just get the next client. Each client teaches a different mistake; this one has sat in cash for nine years.",
      app: '<div class="appname">Arrow · Pro Trader</div>' +
        '<div class="big">Client 2: Priya</div>' +
        '<div class="muted">Retired. Nine years all cash, losing to prices.</div>' +
        '<div class="card"><div class="row"><span>Balance</span><span class="sp"></span><b>$48,200</b></div>' +
        '<div class="row muted"><span>January 2013</span></div></div>' +
        '<div class="card"><div class="row"><span>Target</span><span class="sp"></span><b>$60,000</b></div>' +
        '<div class="row muted"><span>by 2018</span></div></div>' +
        '<div class="goalchip">Cash loses to prices over time.</div>' +
        '<button class="abtn">Open her portfolio</button>',
    },
  ];

  var phone = document.getElementById("phone");
  var caption = document.getElementById("caption");
  var dots = document.getElementById("dots");
  var i = 0;
  steps.forEach(function (s, idx) {
    var el = document.createElement("div");
    el.className = "screen";
    el.id = "s" + idx;
    el.innerHTML = s.app;
    phone.appendChild(el);
  });
  function show() {
    steps.forEach(function (_, idx) {
      document.getElementById("s" + idx).className = "screen" + (idx === i ? " on" : "");
    });
    caption.querySelector("b").textContent = steps[i].goal;
    caption.querySelector("span").textContent = steps[i].note;
    dots.textContent = (i + 1) + " of " + steps.length;
    document.getElementById("back").disabled = i === 0;
    document.getElementById("next").textContent = i === steps.length - 1 ? "Start over" : "Next";
  }
  document.getElementById("next").addEventListener("click", function () {
    i = i === steps.length - 1 ? 0 : i + 1; show();
  });
  document.getElementById("back").addEventListener("click", function () {
    if (i > 0) { i--; show(); }
  });
  show();
})();
</script>
</body>
</html>
