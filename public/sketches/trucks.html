<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Food Truck Row</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: #f6f5f2; color: #1c1c1e;
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 20px 40px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; }
  .spacer { flex: 1; }
  .clock { display: flex; align-items: center; gap: 10px; color: #6d685f; font-size: 14px; }
  .track { position: relative; width: 150px; height: 6px; background: #e4e1da; border-radius: 3px; }
  .sun { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #e8b46a; }
  .readout { font-size: 15px; color: #6d685f; }
  .readout b { color: #1c1c1e; font-weight: 700; font-size: 17px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .card {
    flex: 1 1 300px; background: #fff; border: 1px solid #e4e1da;
    border-radius: 14px; padding: 14px; min-width: 280px;
  }
  svg.scene { display: block; width: 100%; height: auto; border-radius: 9px; }
  .name { font-weight: 700; margin: 10px 0 1px; }
  .status { color: #6d685f; font-size: 14px; min-height: 21px; }
  .trade { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .price { font-weight: 700; font-size: 16px; min-width: 44px; }
  button {
    font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #cfcabf; background: #fff; color: #1c1c1e; cursor: pointer;
  }
  button:hover:enabled { border-color: #9a938a; }
  button:disabled { color: #b5b0a6; cursor: default; }
  .own { margin-left: auto; color: #6d685f; font-size: 14px; }
  .tray {
    margin-top: 16px; background: #fff; border: 1px solid #e4e1da; border-radius: 14px;
    padding: 14px; display: flex; align-items: flex-end; gap: 16px;
  }
  .tray .label { color: #6d685f; font-size: 14px; }
  .tray .cashnum { font-weight: 700; font-size: 18px; }
  #bills { display: flex; align-items: flex-end; gap: 5px; height: 88px; flex: 1; }
  .pile { display: flex; flex-direction: column-reverse; gap: 1px; }
  .bill { width: 34px; height: 7px; background: #7fae8b; border: 1px solid #6b9a77; border-radius: 2px; }
  .float {
    position: absolute; font-weight: 700; color: #2e7d44; pointer-events: none;
    animation: rise 1.4s ease-out forwards; font-size: 15px;
  }
  @keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Own shares of food trucks.</h1>
    <div class="clock"><span id="daylabel">Day 1</span><div class="track"><div class="sun" id="sun"></div></div></div>
    <div class="spacer"></div>
    <div class="readout">Worth <b id="worth">$0</b></div>
  </header>
  <div class="row" id="trucks"></div>
  <div class="tray">
    <div>
      <div class="label">Your cash</div>
      <div class="cashnum" id="cashnum">$0</div>
    </div>
    <div id="bills"></div>
  </div>
</div>
<script>
(function () {
  var cash = 100;
  var SHARES = 8;
  var DAY = 30000;
  var day = 1, dayT = 0;

  // Lines follow the sun: lunch rush peaks midday, and every price is the
  // trailing split per share, so the cause of every move is on screen.
  var trucks = [
    { name: "Taco Truck", body: "#b04a3a", pop: 0.9, serveMs: 1400, windows: 1, mine: 0, register: 0, splits: [] },
    { name: "Burger Truck", body: "#3a6ab0", pop: 1.0, serveMs: 1400, windows: 1, mine: 0, register: 0, splits: [] },
    { name: "Noodle Van", body: "#5d8a66", pop: 0.7, serveMs: 1400, windows: 1, mine: 0, register: 0, splits: [] }
  ];

  trucks.forEach(function (t) {
    t.broken = false;
    t.status = "Parking";
    t.serveClock = 0;
    t.line = 0;
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<svg class="scene" viewBox="0 0 320 150">' +
        '<rect x="0" y="0" width="320" height="150" fill="#f0ede7"/>' +
        '<rect x="0" y="118" width="320" height="32" fill="#dcd8ce"/>' +
        '<g transform="translate(18 52)">' +
          '<rect x="0" y="0" width="150" height="64" rx="8" fill="' + t.body + '"/>' +
          '<rect class="win1" x="96" y="14" width="34" height="26" rx="3" fill="#f4f1ea" stroke="#c9c2b2"/>' +
          '<rect class="win2" x="52" y="14" width="34" height="26" rx="3" fill="#f4f1ea" stroke="#c9c2b2" opacity="0"/>' +
          '<rect x="88" y="6" width="52" height="5" fill="#f4f1ea" opacity=".7"/>' +
          '<circle cx="34" cy="66" r="11" fill="#3d3a35"/><circle cx="34" cy="66" r="5" fill="#8d887e"/>' +
          '<circle cx="118" cy="66" r="11" fill="#3d3a35"/><circle cx="118" cy="66" r="5" fill="#8d887e"/>' +
          '<g class="smoke" opacity="0"><circle cx="20" cy="-8" r="5" fill="#b5b0a6"/><circle cx="30" cy="-16" r="7" fill="#c5c0b6"/></g>' +
        '</g>' +
        '<g class="liners"></g>' +
        '<text class="sale" x="196" y="46" font-size="14" font-weight="700" fill="#2e7d44" opacity="0">+$6</text>' +
      '</svg>' +
      '<div class="name">' + t.name + "</div>" +
      '<div class="status"></div>' +
      '<div class="trade"><span class="price"></span>' +
        '<button class="buy">Buy</button><button class="sell">Sell</button>' +
        '<span class="own"></span></div>';
    document.getElementById("trucks").appendChild(card);
    t.el = card;
    t.linerG = card.querySelector(".liners");
    t.saleT = card.querySelector(".sale");
    t.smoke = card.querySelector(".smoke");
    card.querySelector(".buy").addEventListener("click", function () {
      var p = price(t);
      if (t.mine < SHARES && cash >= p) { cash -= p; t.mine++; render(); }
    });
    card.querySelector(".sell").addEventListener("click", function () {
      var p = price(t);
      if (t.mine > 0) { cash += p; t.mine--; floatTag("+$" + p, t.el); render(); }
    });
  });

  function price(t) {
    if (!t.splits.length) return 25;
    var last = t.splits.slice(-2);
    var avg = last.reduce(function (a, c) { return a + c; }, 0) / last.length;
    return Math.max(2, Math.round(avg * 4));
  }

  function rush() {
    var x = dayT / DAY;
    return Math.max(0, Math.sin(x * Math.PI));
  }

  function floatTag(text, near) {
    var f = document.createElement("div");
    f.className = "float"; f.textContent = text;
    var r = near.getBoundingClientRect();
    f.style.left = (r.left + r.width / 2 + window.scrollX) + "px";
    f.style.top = (r.top + 40 + window.scrollY) + "px";
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 1400);
  }

  var last = performance.now();
  function tick(now) {
    var dt = now - last; last = now;
    dayT += dt;
    if (dayT >= DAY) {
      dayT -= DAY;
      day++;
      trucks.forEach(function (t) {
        var per = Math.floor(t.register / SHARES);
        t.register -= per * SHARES;
        t.splits.push(per);
        t.status = "Day done, split $" + per + " a share";
        if (t.mine > 0 && per > 0) { cash += per * t.mine; floatTag("+$" + (per * t.mine), t.el); }
      });
      if (day === 3) {
        var n = trucks[2];
        n.windows = 2; n.serveMs = 750;
        n.el.querySelector(".win2").setAttribute("opacity", "1");
        n.status = "Opened a second window";
      }
      document.getElementById("daylabel").textContent = "Day " + day;
      render();
    }
    if (day === 2 && !trucks[1].brokeToday && dayT > DAY * 0.35) {
      trucks[1].broken = true;
      trucks[1].brokeToday = true;
      trucks[1].status = "Broke down";
      trucks[1].smoke.setAttribute("opacity", "1");
      setTimeout(function () {
        trucks[1].broken = false;
        trucks[1].status = "Back running";
        trucks[1].smoke.setAttribute("opacity", "0");
        render();
      }, 11000);
      render();
    }
    document.getElementById("sun").style.left = (dayT / DAY * 134) + "px";

    trucks.forEach(function (t) {
      var want = t.broken ? 0 : Math.round(t.pop * rush() * 7);
      if (t.line < want) t.line++;
      else if (t.line > want && Math.random() < 0.1) t.line--;
      if (!t.broken && t.line > 0) {
        t.serveClock += dt;
        if (t.serveClock >= t.serveMs) {
          t.serveClock = 0;
          t.line--;
          t.register += 6;
          if (!t.status || t.status.indexOf("window") < 0) t.status = "Line is " + t.line + " long, register $" + t.register;
          t.saleT.setAttribute("opacity", "1");
          setTimeout(function () { t.saleT.setAttribute("opacity", "0"); }, 350);
        }
      } else if (!t.broken) {
        t.serveClock = 0;
        if (rush() < 0.15) t.status = "Quiet hour";
      }
      var out = "";
      for (var i = 0; i < t.line; i++) {
        var x = 186 + i * 15;
        out += '<circle cx="' + x + '" cy="106" r="5" fill="#6d685f"/><line x1="' + x + '" y1="111" x2="' + x + '" y2="122" stroke="#6d685f" stroke-width="2.5"/>';
      }
      t.linerG.innerHTML = out;
    });
    requestAnimationFrame(tick);
  }

  function render() {
    var worth = cash;
    trucks.forEach(function (t) {
      var p = price(t);
      worth += p * t.mine;
      t.el.querySelector(".status").textContent = t.status;
      t.el.querySelector(".price").textContent = "$" + p;
      t.el.querySelector(".own").textContent = t.mine ? "You own " + t.mine + " of 8" : "8 shares";
      t.el.querySelector(".buy").disabled = t.mine >= SHARES || cash < p;
      t.el.querySelector(".sell").disabled = t.mine === 0;
    });
    document.getElementById("cashnum").textContent = "$" + cash;
    document.getElementById("worth").textContent = "$" + worth;
    var bills = document.getElementById("bills");
    bills.innerHTML = "";
    var tens = Math.floor(cash / 10);
    for (var p2 = 0; p2 < Math.ceil(tens / 10); p2++) {
      var pile = document.createElement("div");
      pile.className = "pile";
      var n = Math.min(10, tens - p2 * 10);
      for (var j = 0; j < n; j++) pile.appendChild(Object.assign(document.createElement("div"), { className: "bill" }));
      bills.appendChild(pile);
    }
  }

  render();
  setInterval(render, 2000);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
